spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # H2 文件存储（开发环境），MODE=MySQL 以贴近生产语法
    url: jdbc:h2:file:./data/xcms;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    # 开发阶段 update 加速迭代（设计文档 §2 持久层约定）
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        # 级联租户隔离：无状态 resolver，从 TenantContext 取当前租户
        multi-tenancy:
          identifier-resolver: com.df4j.xctec.xcms.base.tenant.TenantIdentifierResolver
        format_sql: true

  # H2 控制台（开发访问）
  h2:
    console:
      enabled: true
      path: /h2-console
